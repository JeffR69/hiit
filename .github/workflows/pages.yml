name: Deploy Web App to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - emom-compteur.html
      - icon.svg
      - apple-touch-icon.png
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build restricted Pages artifact
        shell: bash
        run: |
          set -euo pipefail

          readonly files=(
            "emom-compteur.html"
            "icon.svg"
            "apple-touch-icon.png"
          )

          rm -rf _site
          mkdir _site

          for file in "${files[@]}"; do
            test -f "$file"
            install -m 0644 "$file" "_site/$file"
          done

          printf '%s\n' "${files[@]}" | sort > /tmp/pages-expected.txt
          find _site -type f | sed 's#^_site/##' | sort > /tmp/pages-actual.txt
          diff --unified /tmp/pages-expected.txt /tmp/pages-actual.txt

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
